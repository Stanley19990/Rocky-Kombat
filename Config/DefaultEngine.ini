[/Script/Engine.LocalPlayer]
; Which axis the match camera's FieldOfView describes.
;
; The arena picture is framed from the camera's own field of view, so the framing has
; to know which half-angle that number is. UE 5.3 made "maintain Y FOV" the engine
; default, where the value is converted to a vertical angle through the aspect ratio
; and the horizontal angle follows the shape of the window. Pinning it here keeps that
; meaning from drifting with an engine default change. ARKCGameMode::UpdateArenaFraming
; reads the setting at run time, so switching this to AspectRatio_MaintainXFOV still
; frames correctly - it keeps the horizontal angle instead - and logs what it read.
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Rocky Kombat on Android.
;
; Landscape-only, because the arena is framed wide and the touch pad places the
; stick bottom-left and the action buttons bottom-right. The pad is drawn inside the
; safe rectangle reported by the platform, so a cut-out or a gesture bar cannot put a
; control under a system UI element.
PackageName=com.rockycat.rockykombat
ApplicationDisplayName=Rocky Kombat
VersionDisplayName=1.0.0
StoreVersion=1
; 26 (Android 8.0) is the floor for Vulkan plus the modern safe-area metrics API.
MinSDKVersion=26
TargetSDKVersion=36
Orientation=Landscape
bFullScreen=True
; A single self-contained APK: the content is packed inside the APK, so there is no
; second .obb file for the user to keep next to it.
bPackageDataInsideApk=True
; ARM64 only - that is what every phone made in the last several years uses, and it
; keeps the APK small enough to share.
bBuildForArm64=True
bBuildForX8664=False
bBuildForES31=True
bSupportsVulkan=True
; Offline game: no Google Play services, no ads, no analytics.
bEnableGooglePlaySupport=False
bSupportAdMob=False
; Signing values stay empty in source control. Development builds use the local
; Android debug identity; the private packaging script overlays .secrets locally.
KeyStore=
KeyAlias=
KeyStorePassword=
KeyPassword=
