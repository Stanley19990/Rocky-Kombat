; DefaultEngine.ini - Rocky Kombat

[/Script/EngineSettings.GameMapsSettings]
; The match world is built procedurally in C++ by ARKCGameMode (ring, lights,
; camera, fighters), so no .umap asset is required for the game to run. This
; keeps the playable build reproducible from source with no binary assets, and
; a dedicated map can replace GameDefaultMap once the arena art is integrated.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/RockyKombat.RKCGameMode

[/Script/Engine.RendererSettings]
; Rocky Kombat is a low-cost 2D fighter that must hold 60 FPS on integrated
; graphics (target hardware: Intel UHD 620) and on the agreed mobile device.
; Everything below is either free or a real frame-time saving for a game whose
; only 3D content is a flat ring, two sprite billboards and a backdrop.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.LensFlare=False
; The old r.DefaultFeature.AntiAliasing name is ignored in this engine. Use
; spatial FXAA for moving sprites without temporal history or TSR overhead.
r.AntiAliasingMethod=1
r.MobileHDR=False
r.Shadow.Virtual.Enable=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=False
r.Mobile.AllowDeferredShadingOpenGL=0

[/Script/Engine.Engine]
GameViewportClientClassName=/Script/Engine.GameViewportClient

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.PhysicsSettings]
bEnableEnhancedDeterminism=True

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False
bAllowNetworkConnection=False
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


[/Script/Engine.LocalPlayer]
; Which axis the match camera's FieldOfView describes.
;
; The arena picture is framed from the camera's own field of view, so the framing has
; to know which half-angle that number is. UE 5.3 made "maintain Y FOV" the engine
; default, where the value is converted to a vertical angle through the aspect ratio
; and the horizontal angle follows the shape of the window. Pinning it here keeps that
; meaning from drifting with an engine default change. ARKCGameMode::UpdateArenaFraming
; reads the setting at run time, so switching this to AspectRatio_MaintainXFOV still
; frames correctly - it keeps the horizontal angle instead - and logs what it read.
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Rocky Kombat on Android.
;
; Landscape-only, because the arena is framed wide and the touch pad places the
; stick bottom-left and the action buttons bottom-right. The pad is drawn inside the
; safe rectangle reported by the platform, so a cut-out or a gesture bar cannot put a
; control under a system UI element.
PackageName=com.rockycat.rockykombat
ApplicationDisplayName=Rocky Kombat
VersionDisplayName=1.0.3-alpha.3
StoreVersion=4
; Android 8.0+, ARM64 and OpenGL ES 3.2 are required by this engine build.
MinSDKVersion=26
TargetSDKVersion=36
Orientation=Landscape
bFullScreen=True
bShowLaunchImage=True
; A single self-contained APK: the content is packed inside the APK, so there is no
; second .obb file for the user to keep next to it.
bPackageDataInsideApk=True
; ARM64 only - that is what every phone made in the last several years uses, and it
; keeps the APK small enough to share.
bBuildForArm64=True
bBuildForX8664=False
bBuildForES31=True
; Compatibility candidate after a reported exit at startup. Use the simpler
; OpenGL ES path for this 2D game instead of selecting Vulkan automatically.
; This is a mitigation; a phone crash log is still needed to confirm the cause.
bSupportsVulkan=False
bSupportsVulkanSM5=False
bDetectVulkanByDefault=False
; No Google Play services, ads or analytics. Online play uses our own service.
bEnableGooglePlaySupport=False
bSupportAdMob=False
; Signing values stay empty in source control. Development builds use the local
; Android debug identity; the private packaging script overlays .secrets locally.
KeyStore=
KeyAlias=
KeyStorePassword=
KeyPassword=

; iPhone/iPad requires a separately signed iOS build. APKs are Android-only.
; Team, certificate, provisioning and remote-Mac settings stay machine-local.
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
BundleDisplayName=Rocky Kombat
BundleName=RockyKombat
BundleIdentifier=com.rockycat.rockykombat
VersionInfo=1.0.2
MinimumiOSVersion=IOS_15
bSupportsIPhone=True
bSupportsIPad=True
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
bAutomaticSigning=False
