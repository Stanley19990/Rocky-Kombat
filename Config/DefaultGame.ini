; The imported Paper2D artwork is reached through runtime string paths (see
; Source/RockyKombat/Visual/RKCArt.h), not a hard asset reference, so the
; cooker cannot discover it by reference walking. Cooking the folder explicitly
; is what keeps the artwork present in a packaged build.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/RockyKombat/Art")
+DirectoriesToAlwaysCook=(Path="/Game/RockyKombat/Presentation")

; The generated audio set is reached through runtime string paths as well
; (see Source/RockyKombat/Audio/RKCAudio.cpp, AudioContentRoot), so it needs the
; same explicit cook entry. Silently absent audio is exactly the failure this
; line prevents.
+DirectoriesToAlwaysCook=(Path="/Game/RockyKombat/Audio")

